services:
  compute-helper:
    build:
      context: .
      dockerfile: Dockerfile.compute-helper
    env_file:
      # The service fails closed without its secret; making this optional lets
      # `docker compose config` work before an operator creates the untracked
      # compute_helper.env from the provided example.
      - path: ./compute_helper.env
        required: false
    # Keep the raw helper private. Put HTTPS/mTLS proxying or a private tunnel
    # in front of this loopback port if another host must reach the service.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped
